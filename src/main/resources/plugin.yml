name: ZombieWaves
version: 1.5.0
main: com.zombiewaves.ZombieWaves
api-version: '1.21'
description: ZombieWaves - Survive co-op waves of zombies, skeletons and husks for Minecraft 1.21, inspired by Call of Duty Zombies. Earn gold, buy gear at the shop and push your limits.

author: ZombieWavesTeam
commands:
  wave:
    description: Main command for ZombieWaves (player + admin subcommands).
